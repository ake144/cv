spring.application.name=cv

# Server config (Railway automatically provides the PORT environment variable)
server.port=${PORT:8080}

# Database config
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-floral-cherry-a4otv40c-pooler.us-east-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Config (Optimized for Prod)
# Using 'update' is risky in production, you can override this in Railway with DB_DDL_AUTO=validate or none
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
# Hide SQL logs in production by default to save log space and improve performance
spring.jpa.show-sql=${SHOW_SQL:false}  
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# JWT config (we'll use these later)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

